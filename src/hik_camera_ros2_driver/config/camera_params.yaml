/hik_camera_ros2_driver:
  ros__parameters:
    # 全局参数（对节点生效）
    camera_count: 2
    use_sensor_data_qos: false

    # 如果你实现了 serial 绑定（可选）
    # camera_serials: ["DA1234567", "DA7654321"]

    # ---------------- cam0（第一台相机） ----------------
    cam0.camera_info_url: "package://hik_camera_ros2_driver/config/camera_info.yaml"
    cam0.pixel_format: "BayerRG8"
    cam0.adc_bit_depth: "Bits_8"

    cam0.camera_name: "camera0"
    cam0.frame_id: "camera0_optical_frame"
    cam0.camera_topic: "camera0/image"

    cam0.acquisition_frame_rate: 120.0
    cam0.exposure_time: 12000
    cam0.gain: 18.9

    # ---------------- cam1（第二台相机） ----------------
    cam1.camera_info_url: "package://hik_camera_ros2_driver/config/camera_info.yaml"
    cam1.pixel_format: "BayerRG8"
    cam1.adc_bit_depth: "Bits_8"

    cam1.camera_name: "camera1"
    cam1.frame_id: "camera1_optical_frame"
    cam1.camera_topic: "camera1/image"

    cam1.acquisition_frame_rate: 120.0
    cam1.exposure_time: 12000
    cam1.gain: 16.9
