auto_aim_node:
  ros__parameters:
    # ========= 预处理 / 自适应阈值 =========
    detector.binary_thresh: 60
    detector.use_sigma_thresh: true
    detector.sigma_k: 2.5
    detector.min_dynamic_thresh: 80
    detector.max_dynamic_thresh: 220

    # ========= Spot（单个亮斑）筛选 =========
    detector.spot_min_area: 3.0
    detector.spot_max_area: 300.0
    detector.spot_min_ratio: 0.3
    detector.spot_max_ratio: 1.0

    # ========= Pattern（上下双行矩形目标） =========
    detector.min_row_spots: 2
    detector.row_center_x_tol_ratio: 0.35
    detector.row_width_similarity_ratio: 0.5
    detector.pattern_min_aspect: 0.6
    detector.pattern_max_aspect: 4.0

    # ========= 颜色识别 =========
    detector.target_color: 0
    detector.color_threshold: 30

    # ========= 调试显示 =========
    detector.show_contours: false
    detector.show_pairs: true

    # ========= YOLO / TensorRT Pose =========
    detector.mode: "yolo"
    detector.yolo.engine_path: "/home/user/code/T-DT_Radar-main/src/auto_aim_fast/model/auto_aim.engine"
    detector.yolo.input_w: 640
    detector.yolo.input_h: 640
    detector.yolo.max_det: 300
    detector.yolo.target_class_id: 0
    detector.yolo.conf_thresh: 0.05
    detector.yolo.nms_thresh: 0.05
    detector.yolo.kpt_conf_thresh: 0.5
    detector.yolo.min_w_ratio: 0.025
    detector.yolo.min_h_ratio: 0.035
    detector.yolo.min_area_ratio: 0.0020
    detector.yolo.require_outer_corners: true
    detector.yolo.use_fp16_input: true
    detector.yolo.swap_rb_input: true

    # ========= 激光大圆光斑过滤 =========
    # 只过滤外形接近正方/圆形、上下方向亮度结构过低的候选。
    detector.laser_spot_filter.enable: true
    detector.laser_spot_filter.max_near_circle_aspect: 1.35
    detector.laser_spot_filter.min_side_px: 20.0
    detector.laser_spot_filter.min_vertical_cv: 0.12
    detector.laser_spot_filter.min_vertical_gradient: 0.04
    detector.laser_spot_filter.roi_padding_ratio: 0.0

    # 关键点顺序为 8 点:
    # top_1, top_2, top_3, top_4, bottom_1, bottom_2, bottom_3, bottom_4
    # 用于外角点提取：左上、左下、右下、右上
    detector.yolo.outer_corner_indices: [0, 4, 7, 3]
