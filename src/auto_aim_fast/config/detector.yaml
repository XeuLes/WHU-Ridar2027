auto_aim_node:
  ros__parameters:
    detector.binary_thresh: 40
    detector.min_area: 10.0
    detector.max_area: 10000.0
    detector.min_ratio: 0.1
    detector.max_ratio: 0.7
    detector.max_angle: 90.0

    detector.target_color: 1          # 0 red, 1 blue
    detector.color_threshold: 30

    detector.min_light_ratio: 0.6
    detector.min_center_dist: 1.0
    detector.max_center_dist: 5.0
    detector.max_pair_angle: 20.0
    
    # 配对模式参数
    detector.pair_mode: 1             # 0: 左右配对(装甲板), 1: 上下配对(立方体)
    detector.max_x_diff_ratio: 0.5    # x坐标差异上限(上下配对用-图像中上下分布)
    detector.max_y_diff_ratio: 0.1    # y坐标差异上限(左右配对用-图像中左右分布)
    detector.min_vertical_dist: 0.8   # 垂直距离下限(上下配对用)
    detector.max_vertical_dist: 9.0   # 垂直距离上限(上下配对用)
    detector.max_connect_angle: 20.0  # 中心连线与理想方向的最大夹角

    detector.show_contours: false
    detector.show_pairs: true

