auto_aim_node:
  ros__parameters:
    # ========== 图像预处理参数 ==========
    detector.binary_thresh: 40        # 二值化阈值
    detector.min_area: 10.0          # 最小轮廓面积
    detector.max_area: 10000.0       # 最大轮廓面积
    
    # ========== 灯条形状过滤参数 ==========
    detector.min_ratio: 0.1          # 最小宽高比
    detector.max_ratio: 0.7          # 最大宽高比
    detector.max_angle: 90.0         # 最大倾斜角度
    
    # ========== 颜色识别参数 ==========
    detector.target_color: 1         # 目标颜色: 0=红色, 1=蓝色
    detector.color_threshold: 30     # 颜色判定阈值
    
    # ========== 上下配对模式参数 ==========
    detector.pair_mode: 1            # 固定为1: 上下配对(立方体/能量机关)
    
    # 灯条相似度检查
    detector.min_light_ratio: 0.6    # 两灯条长度比最小值
    detector.max_pair_angle: 20.0    # 两灯条角度差最大值(度)
    
    # 位置关系检查
    detector.max_x_diff_ratio: 0.8   # x坐标差异上限(相对灯条长度)
    detector.min_vertical_dist: 0.8  # 垂直距离下限(相对灯条长度)
    detector.max_vertical_dist: 9.0  # 垂直距离上限(相对灯条长度)
    
    # 连线角度检查
    detector.min_connect_angle: 50.0 # 中心连线最小角度(避免水平配对)
    detector.max_connect_angle: 120.0 # 中心连线最大角度(允许倾斜)
    
    # ========== 调试显示参数 ==========
    detector.show_contours: false    # 是否显示轮廓
    detector.show_pairs: true        # 是否显示配对结果

