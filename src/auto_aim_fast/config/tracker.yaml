auto_aim_node:
  ros__parameters:
    image_topic: "/camera/image"

    tracker.confirm_track_frames: 3
    tracker.lost_to_lost_frames: 5
    tracker.lost_to_search_frames: 20
    tracker.min_conf_to_track: 0.3

    tracker.roi_base_size: 200
    tracker.roi_expand_lost: 1.3
    tracker.roi_max_size: 800

    budget.max_lights: 64
    budget.max_pairs: 128
    budget.max_pnp: 2
