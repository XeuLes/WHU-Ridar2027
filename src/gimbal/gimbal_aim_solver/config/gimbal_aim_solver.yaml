gimbal_aim_solver_node:
  ros__parameters:
    uav_topic: "/uav_positions"
    gimbal_angles_topic: "/gimbal/angles"
    target_angles_topic: "/gimbal/rough_command_angles"

    # red / blue
    target_side: "red"

    # /gimbal/angles 的顺序:
    # "pitch_yaw" 表示 data[0]=pitch, data[1]=yaw
    # "yaw_pitch" 表示 data[0]=yaw, data[1]=pitch
    gimbal_angle_order: "pitch_yaw"

    # false: 发布绝对目标角
    # true: 发布相对当前角度的增量
    use_increment_output: false

    publish_debug: true

    # 新鲜度保护
    max_uav_msg_age_sec: 0.5
    max_gimbal_msg_age_sec: 0.5

    # 输出角滤波
    enable_output_filter: false
    output_filter_alpha: 0.2

    # world -> camera, OpenCV 外参
    world_rvec: [1.1965118258991709, -1.2447721431265979, 1.1930272786425775]
    world_tvec: [ 5.4380370388002515, 5.0645066190732093, 7.9561979868420236 ]

    # 云台原点在相机坐标系中的坐标，单位米
    # 相机坐标系按 OpenCV:
    # x右, y下, z前
    # 云台在相机左5cm、上20cm => (-0.05, -0.20, 0.0)
    camera_to_gimbal_xyz: [-0.5862, 0.2027, 5.7972]
    laser_offset_xyz: [0.0, -0.049, 0.0]

    # 零偏补偿
    yaw_offset_deg: 0.0
    pitch_offset_deg: 0.0

    # 机械限幅
    yaw_min_deg: -180.0
    yaw_max_deg: 180.0
    pitch_min_deg: -50.0
    pitch_max_deg: 0.0