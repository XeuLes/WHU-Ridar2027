gimbal_aim_solver_node:
  ros__parameters:
    uav_topic: "/uav_positions"
    gimbal_angles_topic: "/gimbal/angles"
    target_angles_topic: "/gimbal/target_angles"

    # red / blue
    target_side: "red"

    # /gimbal/angles 的顺序:
    # "pitch_yaw" 表示 data[0]=pitch, data[1]=yaw
    # "yaw_pitch" 表示 data[0]=yaw, data[1]=pitch
    gimbal_angle_order: "pitch_yaw"

    # false: 发布绝对目标角
    # true: 发布相对当前角度的增量
    use_increment_output: false

    publish_debug: true

    # 新鲜度保护
    max_uav_msg_age_sec: 0.5
    max_gimbal_msg_age_sec: 0.5

    # 输出角滤波
    enable_output_filter: false
    output_filter_alpha: 0.2

    # world -> camera, OpenCV 外参
    world_rvec: [1.3007738496052885, 1.0519496130346802, -1.0480104909702821]
    world_tvec: [-9.0641934014867864, 1.2351673073596281, 23.979868492980199]

    # 云台原点在相机坐标系中的坐标，单位米
    # 相机坐标系按 OpenCV:
    # x右, y下, z前
    # 云台在相机左5cm、上20cm => (-0.05, -0.20, 0.0)
    camera_to_gimbal_xyz: [-0.05, -0.20, 0.0]

    # 零偏补偿
    yaw_offset_deg: 0.0
    pitch_offset_deg: 0.0

    # 机械限幅
    yaw_min_deg: -180.0
    yaw_max_deg: 180.0
    pitch_min_deg: -30.0
    pitch_max_deg: 30.0