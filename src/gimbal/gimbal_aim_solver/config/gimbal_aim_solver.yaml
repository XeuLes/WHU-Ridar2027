gimbal_aim_solver:
  ros__parameters:
    aim_target_topic: "/auto_aim/target"
    current_angle_topic: "/gimbal/angles"

    cmd_topic: "/gimbal/command_angles"
    cmd_pred_topic: "/gimbal/command_angles_pred"

    target_base_topic: "/gimbal/target_base"
    target_base_pred_topic: "/gimbal/target_base_pred"

    output_angle_unit: "rad"       # rad / deg
    current_angle_unit: "rad"      # rad / deg

    yaw_index: 0
    pitch_index: 1

    # 如果 auto_aim_fast 的 (tx,ty,tz) 坐标系与你的 gimbal_cam_frame 不是完全一致，可在这里给固定补偿
    T_targetmsg_to_gimbal_cam_xyz: [0.0, 0.0, 0.0]
    T_targetmsg_to_gimbal_cam_rpy: [0.0, 0.0, 0.0]

    # 与 gimbal_tf_publisher 保持一致的几何参数
    T_gimbal_base_to_axis1_joint_xyz: [0.0, 0.0, 0.0]
    T_gimbal_base_to_axis1_joint_rpy: [0.0, 0.0, 0.0]

    T_axis1_to_axis2_joint_xyz: [0.0, 0.0, 0.0]
    T_axis1_to_axis2_joint_rpy: [0.0, 0.0, 0.0]

    T_axis2_to_gimbal_cam_xyz: [0.0, 0.0, 0.0]
    T_axis2_to_gimbal_cam_rpy: [0.0, 0.0, 0.0]

    T_gimbal_cam_to_laser_xyz: [0.0, 0.0, 0.0]
    T_gimbal_cam_to_laser_rpy: [0.0, 0.0, 0.0]

    yaw_offset: 0.0
    pitch_offset: 0.0
    yaw_axis: "Z"
    pitch_axis: "Y"
    yaw_sign: 1
    pitch_sign: 1

    ik:
      max_iter: 20
      tol_xy_m: 1.0e-4
      eps_rad: 1.0e-4
      max_step_rad: 0.2

    prediction:
      enable: true
      max_dt_sec: 0.2
