gimbal_serial_bridge:
  ros__parameters:
    # 如果你不确定设备名，填 candidates 列表，程序会依次尝试
    serial_ports: ["/dev/ttyACM0"]
    serial_port: "/dev/ttyACM0"   # 作为 fallback（serial_ports 为空才用）
    baud: 115200

    angles_raw_topic: "/gimbal/angles_raw"
    angles_true_topic: "/gimbal/angles_true"
    quaternion_raw_topic: "/gimbal/quaternion_raw"
    quaternion_true_topic: "/gimbal/quaternion_true"
    mode_up_topic: "/gimbal/mode_up"
    cmd_topic: "/gimbal/command_angles"
    enable_topic: "/gimbal/enable"

    angle_unit: "rad"
    yaw_index: 0
    pitch_index: 1

    yaw_drift_rate: 0.02503
    pitch_protocol_bias_deg: 0.0
    manual_yaw_bias_deg: 0.0
    manual_pitch_bias_deg: -10.0
    zero_init_sample_count: 20
    zero_stable_window_s: 0.1
    zero_stable_required_count: 10
    zero_stable_max_delta_deg: 0.1
    zero_init_timeout_s: 15.0
    gimbal_disconnect_timeout_s: 20.0

    default_enable: false
